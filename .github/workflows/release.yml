name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'test'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeAdmin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: EdgeAdmin
          token: ${{ secrets.GH_PAT }}
      - name: Checkout EdgeCommon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yeqingky/EdgeCommon
          path: EdgeCommon
          token: ${{ secrets.GH_PAT }}
      - name: Checkout EdgeAPI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yeqingky/EdgeAPI
          path: EdgeAPI
          token: ${{ secrets.GH_PAT }}
      - name: Checkout EdgeNode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yeqingky/EdgeNode
          path: EdgeNode
          token: ${{ secrets.GH_PAT }}
      - name: Checkout EdgeTunnel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yeqingky/EdgeTunnel
          path: EdgeTunnel
          token: ${{ secrets.GH_PAT }}
      - name: Set tag
        run: echo "TAG_NAME=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: EdgeAdmin/docker/Dockerfile
          target: admin
          push: true
          tags: ghcr.io/yeqingky/goedge-admin:${{ env.TAG_NAME }}
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: EdgeAdmin/docker/Dockerfile
          target: api
          push: true
          tags: ghcr.io/yeqingky/goedge-api:${{ env.TAG_NAME }}
