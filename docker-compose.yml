services:
  goedge-admin:
    container_name: goedge-admin
    build:
      context: ..
      dockerfile: EdgeAdmin/docker/Dockerfile
      target: admin
    image: ghcr.io/yeqingky/goedge-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      EDGE_DB_HOST: mysql
      EDGE_DB_PORT: "3306"
      EDGE_DB_USER: goedge
      EDGE_DB_PASSWORD: goedge
      EDGE_DB_NAME: goedge
    volumes:
      - ./data/edge-admin/configs:/usr/local/goedge/configs
      - ./data/edge-admin/logs:/usr/local/goedge/logs
      - ./data/shared:/shared:ro
    depends_on:
      goedge-api:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-7788}:7788"
    networks:
      - goedge

  goedge-api:
    container_name: goedge-api
    build:
      context: ..
      dockerfile: EdgeAdmin/docker/Dockerfile
      target: api
    image: ghcr.io/yeqingky/goedge-api
    restart: unless-stopped
    environment:
      EDGE_DB_HOST: mysql
      EDGE_DB_PORT: "3306"
      EDGE_DB_USER: goedge
      EDGE_DB_PASSWORD: goedge
      EDGE_DB_NAME: goedge
      API_NODE_HOST: ${API_NODE_HOST:-goedge-api}
      API_NODE_PORT: "8001"
      ADMIN_RPC_ENDPOINT: http://goedge-api:8001
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
    volumes:
      - ./data/edge-api/configs:/usr/local/goedge/configs
      - ./data/edge-api/data:/usr/local/goedge/data
      - ./data/edge-api/logs:/usr/local/goedge/logs
      - ./data/shared:/shared
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8001"
    networks:
      - goedge

  mysql:
    container_name: goedge-mysql
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: goedge
      MARIADB_DATABASE: goedge
      MARIADB_USER: goedge
      MARIADB_PASSWORD: goedge
    volumes:
      - ./data/mysql:/var/lib/mysql
      # sudo mkdir -p data/mysql
      # sudo chown -R 999:999 data/mysql && sudo chmod 750 data/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - goedge

networks:
  goedge:
    name: goedge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/64
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
